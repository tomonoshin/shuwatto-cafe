<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Kaisei+Decol:wght@500;700&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* Layout: one phone-shaped stage. The 3D café counter fills it; HUD floats in a band at the top (sales + order slip) and a band at the bottom (two bottles, ice, serve). Single deliberate look: deep bottle-green café at night. */
:root{
  --green-950:#11291B; --green-900:#173826; --green-800:#1F4A31; --green-700:#2A5C3D;
  --peach:#F4A7A2; --peach-deep:#DC5F6B; --peach-soft:#FCE1DA;
  --pear:#BFD674; --pear-deep:#6F9A2E; --pear-soft:#EAF2C8;
  --ribbon:#CF3B35; --ribbon-deep:#A12A25;
  --cream:#FBF5E8; --paper:#FFFDF6; --paper-line:#E8DFCB; --ink:#1B3324; --ink-soft:#56695B; --gold:#D9B24C; --ice:#DDF2FB;
  --f-display:"Kaisei Decol","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-latin:"DM Serif Display","Didot","Times New Roman",serif;
  --f-body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Meiryo",sans-serif;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--green-950);color:var(--cream);font-family:var(--f-body);overflow:hidden;-webkit-tap-highlight-color:transparent;
  background-image:radial-gradient(circle at 12% 22%,rgba(244,167,162,.10) 0 70px,transparent 71px),radial-gradient(circle at 88% 70%,rgba(191,214,116,.09) 0 90px,transparent 91px),radial-gradient(circle at 80% 15%,rgba(251,245,232,.06) 0 40px,transparent 41px)}
#root{height:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.stage{position:relative;height:100%;max-width:480px;margin:0 auto;overflow:hidden;background:var(--green-800);box-shadow:0 0 0 1px rgba(0,0,0,.25),0 30px 80px rgba(0,0,0,.5);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.gl{position:absolute;inset:0;display:block;width:100%;height:100%}
.anchors{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.anchor{position:absolute;left:0;top:0;will-change:transform}

/* ---------- top HUD ---------- */
.hud-top{position:absolute;left:0;right:0;top:0;padding:calc(10px + env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) 0 max(14px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:8px;pointer-events:none;z-index:5}
.hud-row{display:flex;align-items:stretch;gap:8px}
.day-pill{font-family:var(--f-display);font-weight:700;background:var(--cream);color:var(--ink);border-radius:999px;padding:3px 12px;font-size:14px;border:2px solid var(--ink);box-shadow:0 2px 0 var(--ink);white-space:nowrap;align-self:center}
.clock{flex:1;height:22px;border-radius:999px;background:rgba(17,41,27,.75);border:2px solid var(--cream);position:relative;overflow:hidden;align-self:center}
.clock>i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--pear),var(--peach));transition:width .1s linear}
.clock>span{position:absolute;inset:0;display:grid;place-items:center;font-size:11px;font-weight:900;color:var(--ink);letter-spacing:.04em;font-variant-numeric:tabular-nums;text-shadow:0 0 4px rgba(255,255,255,.7)}
.clock.late>i{background:linear-gradient(90deg,var(--ribbon),var(--peach))}
.clock.over>span{color:var(--cream);text-shadow:none}
.icon-btn{pointer-events:auto;width:36px;height:36px;flex:none;border-radius:50%;border:2px solid var(--cream);background:rgba(17,41,27,.75);display:grid;place-items:center;padding:0;align-self:center}
.icon-btn svg{width:17px;height:17px}
.sales{flex:none;width:104px;background:var(--ink);border:2px solid var(--gold);border-radius:12px;padding:6px 9px 7px;font-variant-numeric:tabular-nums;display:flex;flex-direction:column;gap:2px;box-shadow:0 3px 0 rgba(0,0,0,.35)}
.sales small{font-size:10px;color:var(--gold);letter-spacing:.08em;font-weight:700}
.sales b{font-family:var(--f-latin);font-size:22px;line-height:1;color:var(--cream);font-weight:400}
.goalbar{height:5px;border-radius:9px;background:rgba(255,255,255,.15);overflow:hidden;margin-top:3px}
.goalbar>i{display:block;height:100%;background:var(--gold);transition:width .3s}
.goalbar.done>i{background:var(--pear)}
.order{flex:1;min-width:0;display:flex;gap:10px;align-items:center;background:var(--paper);color:var(--ink);border-radius:12px;padding:7px 10px;border:2px solid var(--ink);box-shadow:0 3px 0 var(--ink);animation:slipIn .4s cubic-bezier(.3,1.5,.5,1)}
.order.gold{background:linear-gradient(135deg,#FFF7DA,#F7E2A2);border-color:#7A5A12;box-shadow:0 3px 0 #7A5A12}
.order .mini{flex:none;width:38px;height:56px}
.order .txt{flex:1;min-width:0}
.order .who{font-size:10px;color:var(--ink-soft);font-weight:700;display:flex;gap:6px;align-items:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.order .who .star{color:#B07D0E}
.order .req{font-family:var(--f-display);font-size:16px;font-weight:700;line-height:1.25;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.order .gname{font-size:10px;color:var(--ink-soft);display:flex;gap:6px;align-items:center}
.icechip{display:inline-flex;align-items:center;gap:2px;background:var(--ice);border:1.5px solid #6BA9C4;color:#1E5B76;border-radius:6px;padding:0 5px;font-size:10px;font-weight:900;line-height:1.5}
.icechip svg{width:10px;height:10px}
.patience{height:6px;border-radius:999px;background:var(--paper-line);overflow:hidden;margin-top:5px}
.patience>i{display:block;height:100%;background:var(--pear-deep);transition:width .1s linear}
.patience.low>i{background:var(--ribbon)}
.tip{font-size:11px;color:var(--ribbon-deep);font-weight:900;margin-top:4px;line-height:1.3}
@keyframes slipIn{from{transform:translateY(-14px) rotate(-2deg);opacity:0}to{transform:none;opacity:1}}
.mixm{background:var(--paper);color:var(--ink);border:2px solid var(--ink);border-radius:12px;padding:6px 10px 7px;box-shadow:0 3px 0 var(--ink);font-size:11px;font-weight:900;display:grid;grid-template-columns:auto 1fr auto;gap:4px 8px;align-items:center;animation:slipIn .4s cubic-bezier(.3,1.5,.5,1)}
.mixm .bar{position:relative;height:14px;border-radius:999px;background:linear-gradient(90deg,var(--ca),var(--cb));border:1.5px solid var(--ink)}
.mixm .zone{position:absolute;top:-4px;bottom:-4px;border:2px dashed var(--ink);border-radius:6px;background:rgba(255,255,255,.35)}
.mixm .needle{position:absolute;top:-6px;bottom:-6px;width:4px;margin-left:-2px;background:var(--ink);border-radius:2px;transition:left .1s linear}
.mixm .needle.ok{background:var(--ribbon)}
.mixm .cap{grid-column:1/-1;text-align:center;font-size:10px;color:var(--ink-soft);font-variant-numeric:tabular-nums}

/* ---------- 3D anchored labels ---------- */
.bubble{position:absolute;left:0;bottom:0;transform:translateX(-50%);transform-origin:50% 100%;max-width:min(300px,80vw);white-space:normal;text-align:center;width:max-content;background:var(--paper);color:var(--ink);font-weight:700;font-size:13px;line-height:1.35;padding:7px 11px;border-radius:14px;border:2px solid var(--ink);box-shadow:0 3px 0 rgba(0,0,0,.25);animation:bub .35s cubic-bezier(.3,1.6,.5,1)}
.bubble::after{content:"";position:absolute;left:calc(50% - 7px);bottom:-9px;width:12px;height:12px;background:var(--paper);border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:rotate(45deg) skew(8deg,8deg)}
.bubble.gold,.bubble.gold::after{background:#FFF4CF}
@keyframes bub{from{scale:.3;opacity:0}to{scale:1;opacity:1}}
.anchor[data-side="right"] .bubble{bottom:auto;top:0;transform:translateY(-50%);transform-origin:0 50%;text-align:left}
.anchor[data-side="right"] .bubble::after{left:-8px;bottom:auto;top:calc(50% - 6px);border-right:0;border-bottom:2px solid var(--ink);border-left:2px solid var(--ink);transform:rotate(45deg)}
.anchor[data-side="left"] .bubble{left:auto;right:0;bottom:auto;top:0;transform:translateY(-50%);transform-origin:100% 50%;text-align:left}
.anchor[data-side="left"] .bubble::after{left:auto;right:-8px;bottom:auto;top:calc(50% - 6px);border-bottom:0;border-top:2px solid var(--ink);border-right:2px solid var(--ink);transform:rotate(45deg)}
.tlabel{position:absolute;left:0;top:0;transform:translate(0,-50%);display:flex;align-items:center;gap:3px;font-size:11px;font-weight:900;color:var(--paper);background:var(--c);padding:1px 7px 1px 5px;border-radius:999px;border:1.5px solid var(--ink);white-space:nowrap}
.tlabel::before{content:"";width:0;height:0;border:5px solid transparent;border-right:6px solid var(--ink);margin-left:-17px;margin-right:4px}
.judge{position:absolute;left:0;top:0;transform:translate(-50%,-50%);text-align:center;white-space:nowrap;animation:pop .55s cubic-bezier(.3,1.6,.5,1) both}
.judge .g{font-family:var(--f-display);font-weight:700;font-size:40px;line-height:1.05;color:var(--gc,var(--cream));
  text-shadow:3px 0 0 var(--ink),-3px 0 0 var(--ink),0 3px 0 var(--ink),0 -3px 0 var(--ink),2px 2px 0 var(--ink),-2px 2px 0 var(--ink),2px -2px 0 var(--ink),-2px -2px 0 var(--ink),0 6px 0 var(--ink)}
.judge .yen{display:inline-block;margin-top:6px;font-family:var(--f-latin);font-size:22px;color:var(--ink);background:var(--gold);border:2px solid var(--ink);border-radius:999px;padding:0 12px;animation:rise 1.4s ease-out both .15s}
.judge .yen.zero{background:var(--paper-line)}
.judge .hint{display:block;margin-top:6px;font-size:12px;font-weight:900;color:var(--ink);background:var(--paper);border-radius:8px;padding:2px 8px;width:max-content;margin-inline:auto}
.combo{display:block;width:max-content;margin:6px auto 0;background:var(--ribbon);color:var(--cream);font-family:var(--f-display);font-weight:700;font-size:15px;padding:3px 22px;clip-path:polygon(0 0,100% 0,93% 50%,100% 100%,0 100%,7% 50%);animation:popc .5s cubic-bezier(.3,1.6,.5,1) both .1s}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}100%{transform:translate(-50%,-50%) scale(1);opacity:1}}
@keyframes popc{0%{transform:scale(.3);opacity:0}100%{transform:none;opacity:1}}
@keyframes rise{0%{transform:translateY(8px);opacity:0}25%{transform:none;opacity:1}100%{transform:translateY(-6px);opacity:1}}

/* ---------- bottom controls ---------- */
.hud-bottom{position:absolute;left:0;right:0;bottom:0;padding:0 max(14px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:end;z-index:5}
.pour{pointer-events:auto;touch-action:none;height:92px;border-radius:24px;border:3px solid var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-family:var(--f-display);font-weight:700;font-size:20px;color:var(--ink);box-shadow:0 6px 0 var(--ink);transition:transform .06s,box-shadow .06s;position:relative;padding:0;background:radial-gradient(circle at 30% 22%,var(--b0),var(--b1) 78%)}
.pour svg{width:34px;height:34px;pointer-events:none}
.pour.active{transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
.pour small{font-family:var(--f-body);font-size:10px;font-weight:900;opacity:.65;letter-spacing:.05em}
.pour.hint::after{content:"";position:absolute;inset:-8px;border-radius:30px;border:3px solid var(--cream);animation:pulse 1.1s ease-in-out infinite;pointer-events:none}
@keyframes pulse{0%,100%{opacity:.15;transform:scale(.97)}50%{opacity:1;transform:scale(1.02)}}
.center-col{display:flex;flex-direction:column;align-items:center;gap:8px}
.hud-bottom.multi{grid-template-columns:minmax(0,1fr);gap:10px}
.action-row{display:flex;justify-content:center;align-items:center;gap:12px}
.hud-bottom.multi .serve{margin-bottom:0;height:54px}
.pour-row{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:7px}
.pour-row .pour{height:72px;font-size:16px;border-radius:18px;box-shadow:0 5px 0 var(--ink)}
.pour-row .pour.active{box-shadow:0 1px 0 var(--ink)}
.pour-row .pour svg{width:26px;height:26px}
.pour-row .pour small{display:none}
.pour-row .pour.hint::after{inset:-6px;border-radius:22px}
.serve{pointer-events:auto;height:62px;min-width:112px;padding:0 26px;border:0;background:var(--ribbon);color:var(--cream);font-family:var(--f-display);font-weight:700;font-size:21px;clip-path:polygon(0 0,100% 0,90% 50%,100% 100%,0 100%,10% 50%);filter:drop-shadow(0 5px 0 var(--ribbon-deep));transition:transform .08s,opacity .2s;margin-bottom:14px}
.serve:disabled{opacity:.4;cursor:default}
.serve.ready{animation:wiggle 1.2s ease-in-out infinite}
.serve:active:not(:disabled){transform:translateY(4px)}
@keyframes wiggle{0%,100%{transform:none}50%{transform:scale(1.07)}}
.icebtn{pointer-events:auto;display:flex;align-items:center;gap:6px;height:40px;padding:0 14px 0 8px;border-radius:999px;border:2.5px solid var(--ink);background:linear-gradient(180deg,#F4FBFF,var(--ice));color:#1E5B76;font-weight:900;font-size:13px;box-shadow:0 4px 0 var(--ink)}
.icebtn svg{width:22px;height:22px}
.icebtn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.icebtn:disabled{opacity:.45;cursor:default}
.icebtn.hint{animation:wiggle 1.1s ease-in-out infinite}

/* ---------- overlays ---------- */
.banner{position:absolute;left:0;right:0;top:40%;display:grid;place-items:center;pointer-events:none;z-index:8}
.banner span{font-family:var(--f-display);font-weight:700;font-size:28px;background:var(--cream);color:var(--ribbon);border:3px solid var(--ink);padding:6px 26px;border-radius:14px;box-shadow:0 5px 0 var(--ink);animation:popc .45s cubic-bezier(.3,1.6,.5,1)}
.legend{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;overflow:hidden;z-index:9;animation:fadeio 2.6s ease both}
.legend .flash{position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,rgba(255,250,230,.75),rgba(255,240,200,0) 65%)}
.legend .rays{position:absolute;left:50%;top:45%;width:180vmax;height:180vmax;margin:-90vmax 0 0 -90vmax;background:repeating-conic-gradient(from 0deg,rgba(255,255,255,0) 0 7deg,rgba(255,236,190,.38) 7deg 14deg);-webkit-mask:radial-gradient(circle,#000 8%,transparent 42%);mask:radial-gradient(circle,#000 8%,transparent 42%);animation:spin 9s linear infinite}
.legend .box{position:relative;text-align:center;transform:translateY(-30px)}
.legend .word{font-family:var(--f-latin);font-size:min(15vw,62px);line-height:1;background:linear-gradient(90deg,#FF6F91,#FFB15C,#FFE86B,#8EDB7F,#62C6F2,#B597FF,#FF6F91);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 var(--ink)) drop-shadow(2px 0 0 var(--ink)) drop-shadow(-2px 0 0 var(--ink));animation:slide 1.6s linear infinite,popc .6s cubic-bezier(.3,1.6,.5,1) both}
.legend .sub{display:inline-block;margin-top:10px;font-family:var(--f-display);font-weight:700;font-size:16px;color:var(--ink);background:var(--paper);border:2px solid var(--ink);padding:3px 14px;border-radius:999px}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes slide{to{background-position:200% 0}}
@keyframes fadeio{0%{opacity:0}8%{opacity:1}80%{opacity:1}100%{opacity:0}}

.sheet{position:absolute;inset:0;display:grid;place-items:center;background:rgba(12,30,19,.62);padding:calc(20px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:20;overflow-y:auto}
.card{width:min(340px,100%);background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:20px;padding:22px 20px 18px;box-shadow:0 7px 0 var(--ink);text-align:center;animation:popc .4s cubic-bezier(.3,1.5,.5,1)}
.card h2{font-family:var(--f-display);font-size:24px;margin:4px 0 10px;text-wrap:balance}
.card ul,.card ol{text-align:left;margin:0 0 14px;padding-left:1.2em;font-size:14px;line-height:1.65}
.card li+li{margin-top:4px}
.intro-day{font-family:var(--f-display);font-weight:700;color:var(--ribbon);font-size:15px;letter-spacing:.1em}
.intro-day b{font-family:var(--f-latin);font-weight:400;font-size:48px;line-height:1;margin-right:2px;color:var(--green-800)}
.rules{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:0 0 12px}
.rules span{font-size:11px;font-weight:900;border:1.5px solid var(--ink);border-radius:999px;padding:2px 9px;background:var(--cream)}
.goal{background:var(--pear-soft);border-radius:12px;padding:8px 10px;font-size:13px;font-weight:700;margin-bottom:14px}
.goal b{font-family:var(--f-latin);font-weight:400;font-size:20px;margin-left:6px}
.cta{display:block;width:100%;height:54px;border:0;background:var(--ribbon);color:var(--cream);font-family:var(--f-display);font-weight:700;font-size:20px;clip-path:polygon(0 0,100% 0,95% 50%,100% 100%,0 100%,5% 50%);filter:drop-shadow(0 4px 0 var(--ribbon-deep))}
.cta:active{transform:translateY(3px)}
.ghost{flex:1;min-width:0;height:44px;border-radius:999px;border:2px solid var(--cream);background:rgba(17,41,27,.78);color:var(--cream);font-weight:900;font-size:14px}
.link{margin-top:10px;background:none;border:0;color:var(--ink-soft);font-size:13px;font-weight:700;text-decoration:underline;text-underline-offset:3px}
.card .ghost,.receipt .ghost{border-color:var(--ink);background:transparent;color:var(--ink)}

/* title */
.title{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;justify-content:space-between;padding:calc(26px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));pointer-events:none}
.marquee{pointer-events:auto;align-self:center;width:min(300px,84%);background:var(--cream);color:var(--green-800);border:3px solid var(--ink);border-radius:150px 150px 20px 20px;padding:30px 18px 16px;text-align:center;box-shadow:0 6px 0 var(--ink);position:relative;animation:popc .6s cubic-bezier(.3,1.4,.5,1)}
.marquee::before{content:"";position:absolute;inset:6px;border:1.5px solid var(--peach-deep);border-radius:144px 144px 15px 15px;pointer-events:none}
.marquee .eyebrow{font-family:var(--f-display);font-size:13px;letter-spacing:.5em;color:var(--ribbon);font-weight:700;padding-left:.5em}
.marquee h1{font-family:var(--f-display);font-weight:700;font-size:clamp(34px,12vw,50px);white-space:nowrap;margin:2px 0 6px;line-height:1.05;color:var(--green-800);text-shadow:3px 3px 0 var(--peach)}
.ribbon{display:inline-block;background:var(--ribbon);color:var(--cream);font-family:var(--f-latin);font-style:italic;font-size:19px;letter-spacing:.04em;padding:3px 30px;clip-path:polygon(0 0,100% 0,92% 50%,100% 100%,0 100%,8% 50%)}
.marquee .sub{font-size:12px;font-weight:700;margin:10px 0 0;color:var(--ink-soft);line-height:1.5}
.title-bottom{pointer-events:auto;display:flex;flex-direction:column;gap:9px;width:min(340px,100%);align-self:center}
.title-meta{display:flex;justify-content:center;gap:8px;align-items:center}
.day-pick{display:flex;align-items:center;justify-content:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:16px;background:var(--green-900);border:2px solid var(--cream);border-radius:999px;padding:4px 6px;box-shadow:0 3px 0 rgba(0,0,0,.3)}
.day-pick span{min-width:58px;text-align:center}
.day-pick button{width:30px;height:30px;border-radius:50%;border:0;background:var(--cream);color:var(--ink);font-size:18px;font-weight:900;line-height:1;padding:0}

    const minLayer=n===1?0.35:0.16;
    total=rand(Math.max(0.45,minLayer*n+0.05),maxTop);
    let tops=[total];
    if(n>1){ let cuts=[]; for(let t=0;t<30;t++){ cuts=[]; for(let i=0;i<n-1;i++) cuts.push(rand(minLayer,total-minLayer)); cuts.sort((a,b)=>a-b); let ok=true,p=0; for(const c of cuts){ if(c-p<minLayer) ok=false; p=c; } if(total-p<minLayer) ok=false; if(ok) break; } tops=[...cuts,total]; }
    layers=seq.map((f,i)=>({fruit:f,top:r2(tops[i])}));
    let pv=0; for(const L of layers){ req[L.fruit]=(req[L.fruit]||0)+L.top-pv; pv=L.top; }
    lines=layers.map(L=>({top:L.top,color:FRUIT[L.fruit].line,label:FRUIT[L.fruit].name}));
  } else {

// 引き継ぎコード: 保存データを文字列にして、別の端末・別の場所へ手で移す（サーバーなし）
const CODE_HEAD='SHUWA1-';
const sum4=t=>{ let h=7; for(let i=0;i<t.length;i++) h=(h*31+t.charCodeAt(i))>>>0; return h.toString(36).slice(-4).padStart(4,'0'); };
function saveToCode(s){
  const {updatedAt,...rest}=s;
  let bin=''; new TextEncoder().encode(JSON.stringify(rest)).forEach(b=>{ bin+=String.fromCharCode(b); });
  const b64=btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  return CODE_HEAD+b64+'.'+sum4(b64);
}
function codeToSave(code){
  const c=String(code||'').replace(/\s+/g,'');
  if(!c.startsWith(CODE_HEAD)) return null;
  const [b64,chk]=c.slice(CODE_HEAD.length).split('.');
  if(!b64||sum4(b64)!==chk) return null;
  try{
    const bin=atob(b64.replace(/-/g,'+').replace(/_/g,'/'));
    const s=JSON.parse(new TextDecoder().decode(Uint8Array.from(bin,ch=>ch.charCodeAt(0))));
    const obj=v=>v&&typeof v==='object'&&!Array.isArray(v);
    if(!obj(s)||!Number.isInteger(s.unlocked)||s.unlocked<1||!Number.isFinite(s.wallet||0)||!obj(s.best||{})||!obj(s.owned||{})) return null;
    return normSave(s);
  }catch(e){ return null; }
}

const midi=m=>440*Math.pow(2,(m-69)/12);
class Sfx{
  constructor(){ this.ctx=null; this.muted=false; this.bgmOn=false; }
  init(){
    if(this.ctx){ if(this.ctx.state==='suspended') this.ctx.resume(); this.syncBgm(); return; }
    try{
      const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
      const c=this.ctx=new AC();
      this.out=c.createGain(); this.out.gain.value=0.55; this.out.connect(c.destination);
      // 効果音は master、BGM は bgmGain を通して out へ。効果音オフで BGM まで止めないよう分けている
      this.master=c.createGain(); this.master.gain.value=this.muted?0:1; this.master.connect(this.out);
      const len=c.sampleRate*2, buf=c.createBuffer(1,len,c.sampleRate), d=buf.getChannelData(0);
      for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
      const mk=(type,f,q)=>{ const s=c.createBufferSource(); s.buffer=buf; s.loop=true; const fl=c.createBiquadFilter(); fl.type=type; fl.frequency.value=f; fl.Q.value=q; const g=c.createGain(); g.gain.value=0; s.connect(fl); fl.connect(g); g.connect(this.master); s.start(); return {g,fl}; };
      this.fizz=mk('highpass',3200,0.5);
      this.pour=mk('bandpass',700,1.4);
      const lfo=c.createOscillator(); lfo.frequency.value=9; const lg=c.createGain(); lg.gain.value=260; lfo.connect(lg); lg.connect(this.pour.fl.frequency); lfo.start();
      this.bgmGain=c.createGain(); this.bgmGain.gain.value=0; this.bgmGain.connect(this.out);
      this.syncBgm();
    }catch(e){ this.ctx=null; }
  }
  setMuted(m){ this.muted=m; if(this.master) this.master.gain.value=m?0:1; }
  setLevels(flow,fizz){ if(!this.ctx) return; const t=this.ctx.currentTime; this.pour.g.gain.setTargetAtTime(flow*0.32,t,0.04); this.fizz.g.gain.setTargetAtTime(fizz*0.05,t,0.15); }
  tone(f,d,{type='sine',vol=0.15,at=0,slide=null,attack=0.006,dest=null,when=null}={}){
    const c=this.ctx; if(!c) return; const t=when??(c.currentTime+at); const o=c.createOscillator(), g=c.createGain();
    o.type=type; o.frequency.setValueAtTime(f,t); if(slide) o.frequency.exponentialRampToValueAtTime(slide,t+d);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+attack); g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g); g.connect(dest||this.master); o.start(t); o.stop(t+d+0.05);
  }
  bell(){ this.tone(1568,0.45,{type:'triangle',vol:0.1}); this.tone(1175,0.6,{type:'triangle',vol:0.1,at:0.13}); }
  tap(){ this.tone(660,0.05,{vol:0.05}); }
  clink(){ this.tone(2600,0.12,{type:'triangle',vol:0.07}); this.tone(3400,0.18,{vol:0.05,at:0.04}); }
  coin(){ this.tone(1319,0.12,{type:'square',vol:0.04}); this.tone(1976,0.3,{type:'square',vol:0.04,at:0.08}); }
  perfect(){ [1047,1319,1568,2093].forEach((f,i)=>this.tone(f,0.32,{vol:0.11,at:i*0.065})); }
  good(){ [880,1175].forEach((f,i)=>this.tone(f,0.3,{vol:0.1,at:i*0.08})); }
  bad(){ this.tone(392,0.35,{type:'triangle',slide:262,vol:0.1}); }
  spill(){ this.tone(300,0.5,{type:'sawtooth',slide:120,vol:0.05}); }
  legend(){ [523,659,784,1047,1319,1568,2093,2637].forEach((f,i)=>this.tone(f,0.5,{type:'triangle',vol:0.09,at:i*0.06})); [2637,3136].forEach((f,i)=>this.tone(f,1.2,{vol:0.05,at:0.55+i*0.1})); }
  fanfare(ok){ (ok?[784,988,1175,1568]:[523,494,440]).forEach((f,i)=>this.tone(f,0.4,{type:'triangle',vol:0.1,at:i*0.12})); }
  /* gentle kissaten BGM: Fmaj7 - Dm7 - Gm7 - C7, swung eighths */
  setBgm(on){ this.bgmOn=on; this.syncBgm(); }
  syncBgm(){

  }
  sched(){
    const c=this.ctx; const spb=60/92;
    const CH=[[53,57,60,64],[50,53,57,60],[55,58,62,65],[48,52,55,58]];
    const MEL=[72,74,76,77,79,81,84];
    while(this.nextBeat<c.currentTime+0.25){
      const b=this.beat, t=this.nextBeat, ch=CH[Math.floor(b/8)%4], pos=b%8;
      if(pos===0||pos===4) this.tone(midi(ch[0]-12),0.5,{type:'sine',vol:0.09,when:t,dest:this.bgmGain});

}

class Sprites{
  constructor(n,tex,additive){
    this.n=n; this.i=0;
    const g=this.geo=new THREE.BufferGeometry();
    this.pos=new Float32Array(n*3); this.col=new Float32Array(n*3); this.size=new Float32Array(n); this.alpha=new Float32Array(n);

      vertexShader:`attribute vec3 aColor; attribute float aSize; attribute float aAlpha; varying vec3 vC; varying float vA; uniform float uScale;
        void main(){ vC=aColor; vA=aAlpha; vec4 mv=modelViewMatrix*vec4(position,1.0); gl_PointSize=aSize*uScale/max(0.1,-mv.z); gl_Position=projectionMatrix*mv; }`,

  }
  emit(p,v,{size=0.15,life=0.8,color='#ffffff',grav=0,alpha=1,twinkle=0}={}){
    const i=this.i; this.i=(this.i+1)%this.n;
    this.pos.set([p.x,p.y,p.z],i*3); this.vel.set([v.x,v.y,v.z],i*3);
    this.tmpC.set(color); this.col.set([this.tmpC.r,this.tmpC.g,this.tmpC.b],i*3);
    this.base[i]=size; this.life[i]=life; this.max[i]=life; this.grav[i]=grav; this.a0[i]=alpha; this.tw[i]=twinkle;
  }
  update(dt,time){
    for(let i=0;i<this.n;i++){
      if(this.life[i]<=0){ this.alpha[i]=0; continue; }
      this.life[i]-=dt; const k=i*3;
      this.vel[k+1]-=this.grav[i]*dt; const drag=Math.exp(-dt*1.8);

      this.pos[k]+=this.vel[k]*dt; this.pos[k+1]+=this.vel[k+1]*dt; this.pos[k+2]+=this.vel[k+2]*dt;
      const t=clamp(this.life[i]/this.max[i],0,1);
      const fadeIn=clamp((1-t)/0.12,0,1);
      let a=this.a0[i]*Math.min(fadeIn,t*2.2);
      if(this.tw[i]) a*=0.55+0.45*Math.sin(time*18+i*1.7);
      this.alpha[i]=Math.max(0,a);
      this.size[i]=this.base[i]*(0.5+0.5*Math.sin(Math.min(1,(1-t)*3)*Math.PI*0.5))*(0.6+0.4*t);
    }
    const g=this.geo; g.attributes.position.needsUpdate=true; g.attributes.aAlpha.needsUpdate=true; g.attributes.aSize.needsUpdate=true; g.attributes.aColor.needsUpdate=true;
  }
}

    const vs=`varying float vY; varying vec3 vP; varying vec3 vN; varying vec3 vV; void main(){ vY=position.y; vP=position; vec4 mv=modelViewMatrix*vec4(position,1.0); vN=normalize(normalMatrix*normal); vV=normalize(-mv.xyz); gl_Position=projectionMatrix*mv; }`;
    const fs=`uniform float uLevel,uFoam,uBaseY,uH,uTime,uIsTop; uniform int uCount; uniform float uTops[6]; uniform vec3 uCols[6]; uniform vec3 uFoamCol;
      varying float vY; varying vec3 vP; varying vec3 vN; varying vec3 vV;
      float hash(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }
      vec3 segCol(float yn){ vec3 c=uCols[0]; for(int i=1;i<6;i++){ if(i>=uCount) break; float b=uTops[i-1]; c=mix(c,uCols[i],smoothstep(b-0.018,b+0.018,yn)); } return c; }

    const a=this.buildAnimal(key,special);
    a.g.position.set(3.4,0,-2.35); this.scene.add(a.g);
    this.cust={...a,key,special,state:'walk',from:3.4,to:0,t:0,dur:0.85,x:3.4,react:null,rt:0,blink:rand(1.5,3.5)};
  }
  customerExit(){ if(!this.cust) return; const c=this.cust; c.state='walk'; c.from=c.x; c.to=-3.6; c.t=0; c.dur=0.8; c.leaving=true; c.react=null; }
  customerReact(kind){ if(!this.cust) return; this.cust.react=kind; this.cust.rt=0; }
  removeCustomer(c){ this.scene.remove(c.g); c.g.traverse(o=>{ if(o.material && o.material.dispose) o.material.dispose(); }); if(this.cust===c) this.cust=null; }

  burst(kind){
    const top=this.tmp.set(this.glassGroup.position.x,this.glassTopY()+0.05,this.glassGroup.position.z);
    const n={perfect:28,good:14,legend:90,small:10}[kind]||12;
    const cols=kind==='legend'?['#FF6F91','#FFB15C','#FFE86B','#8EDB7F','#62C6F2','#B597FF']:['#FFFFFF','#FFE9A8','#FFD0CA','#E9F5C0'];
    for(let i=0;i<n;i++){ const a=Math.random()*Math.PI*2; const sp=kind==='legend'?rand(1.5,3.6):rand(0.8,2.0);
      this.sparks.emit(top.clone().add(new V3(rand(-0.2,0.2),rand(-0.3,0.2),rand(-0.1,0.1))),new V3(Math.cos(a)*sp,Math.abs(Math.sin(a))*sp*0.9+0.4,rand(-0.3,0.3)),{size:rand(0.14,kind==='legend'?0.42:0.3),life:rand(0.7,1.3),color:pick(cols),grav:1.4,twinkle:1}); }
  }
  customerBurst(){ if(!this.cust) return; const p=this.cust.g.position.clone().add(new V3(0,1.7,0.2)); for(let i=0;i<8;i++) this.sparks.emit(p.clone().add(new V3(rand(-0.5,0.5),rand(-0.2,0.3),0)),new V3(rand(-0.4,0.4),rand(0.3,0.9),0),{size:rand(0.12,0.22),life:rand(0.6,1),color:pick(['#FFFFFF','#FFD0CA','#FFE9A8']),twinkle:1}); }
  spillFX(color){ const def=this.gdef; const gp=this.glassGroup.position; for(let i=0;i<3;i++){ const a=rand(-1.3,1.3); const r=def.r(1)+def.wall; this.emitDrop(new V3(gp.x+Math.sin(a)*r,this.glassTopY(),gp.z+Math.cos(a)*r),new V3(Math.sin(a)*0.25,rand(-0.1,0.2),Math.cos(a)*0.25),rand(0.025,0.045),color,0.02); } }

  resize(w,h){
    this.w=w; this.h=h; this.renderer.setSize(w,h,false);
    const aspect=w/h; this.camera.aspect=aspect;
    const D=this.camDist, needHalfW=1.6, needHalfH=3.45;
    const t=Math.max(needHalfW/(D*aspect),needHalfH/D);
    this.camera.fov=2*Math.atan(t)*180/Math.PI;
    this.camera.position.copy(this.camTarget).addScaledVector(this.camDir,D);
    this.camera.lookAt(this.camTarget);
    this.camera.clearViewOffset();
    this.camera.updateProjectionMatrix();
    this.camera.updateMatrixWorld();
    this.fitGlass(t);
    const sc=h*this.renderer.getPixelRatio()/(2*Math.tan(this.camera.fov*Math.PI/360));
    this.sparks.mat.uniforms.uScale.value=sc; this.bgb.mat.uniforms.uScale.value=sc;
  }
  /* 低い画面では上下の HUD がグラスを隠すので、HUD のあいだの帯にグラス全体（カウンター〜いちばん背の高いグラスの上）が入るよう、引いてからずらす。縦長のスマホではそのまま */
  setInsets(top,bottom){
    if(Math.abs(top-(this.insetT||0))<4&&Math.abs(bottom-(this.insetB||0))<4) return;
    this.insetT=top; this.insetB=bottom; if(this.w) this.resize(this.w,this.h);
  }
  fitGlass(t){
    const T=this.insetT||0, B=this.insetB||0, h=this.h, m=6, band=h-T-B-m*2;
    if(band<40) return;
    // グラスの定位置（出し入れのアニメ中に測っても同じになるように）
    const span=()=>({lo:this.project(new V3(0,-0.02,0)).y, hi:this.project(new V3(0,2.3,0)).y});
    let s=span();
    if(s.lo-s.hi>band){ this.camera.fov=2*Math.atan(t*(s.lo-s.hi)/band)*180/Math.PI; this.camera.updateProjectionMatrix(); s=span(); }
    if(s.lo<=h-B-m&&s.hi>=T+m) return;
    const dy=(s.lo+s.hi)/2-(T+m+band/2);
    this.camera.setViewOffset(this.w,h,0,dy,this.w,h);
  }
  project(v){ const p=this.tmp2.copy(v).project(this.camera); return {x:(p.x*0.5+0.5)*this.w,y:(-p.y*0.5+0.5)*this.h}; }
  place(el,v,dx=0,dy=0){ if(!el) return; const p=this.project(v); el.style.transform=`translate3d(${(p.x+dx).toFixed(1)}px,${(p.y+dy).toFixed(1)}px,0)`; }

  update(dt){
    this.time+=dt; const t=this.time; const def=this.gdef;
    this.LU.uTime.value=t;
    const ga=this.glassAnim; ga.t+=dt; const G=this.glassGroup;
    if(ga.kind==='in'){ const k=clamp(ga.t/0.5,0,1); G.visible=true; G.position.set(lerp(2.6,0,easeOutBack(k)),0,0); if(k>=1) ga.kind='idle'; }
    else if(ga.kind==='serve'){ const k=easeInOut(clamp(ga.t/0.45,0,1)); G.position.set(0,0,lerp(0,-0.85,k)); }
    else if(ga.kind==='carry'){ G.position.set(this.cust?this.cust.x:G.position.x-dt*4,0,-0.85); if(!this.cust||ga.t>1.2) G.visible=false; }
    else if(ga.kind==='away'){ const k=clamp(ga.t/0.5,0,1); G.position.set(lerp(0,3,easeInOut(k)),0,G.position.z); if(k>=1) G.visible=false; }
    else if(ga.kind==='idle'){ G.position.set(0,0,0); G.visible=true; }

    // liquid uniforms
    const L=this.LU; L.uLevel.value=this.level; L.uFoam.value=this.foam;
    if(this.mix){ const m=this.mix; this.mixCol.set(FRUIT[m.a].liquid).lerp(this.mixCol2.set(FRUIT[m.b].liquid),clamp(1-m.wa,0,1)); L.uCount.value=1; L.uCols.value[0].copy(this.mixCol); L.uFoamCol.value.set('#FFFAF4'); }
    else {
      const segs=this.segs.length?this.segs:[{fruit:'peach',top:0}];
      L.uCount.value=Math.min(6,segs.length);
      for(let i=0;i<6;i++){ const s=segs[Math.min(i,segs.length-1)]; L.uTops.value[i]=s.top; L.uCols.value[i].set(FRUIT[s.fruit].liquid); }
      L.uFoamCol.value.set(FRUIT[segs[segs.length-1].fruit].foam);
    }
    const surf=this.level+this.foam;
    this.liquid.visible=surf>0.004; this.liquidTop.visible=surf>0.004;
    const surfY=def.baseY+Math.min(1,surf)*def.H; const rr=Math.max(0.01,def.r(Math.min(1,surf))-0.008);
    this.liquidTop.position.y=surfY; this.liquidTop.scale.set(rr,1,rr);
    // flow は果汁ごと（peach / pear …）。足し合わせて全体の勢いにする（以前は flow.L+flow.R で NaN になり、液面が描かれなかった）
    let flowAll=0; for(const f in this.flow) flowAll+=this.flow[f]||0;
    this.liquidTop.rotation.z=Math.sin(t*11)*0.02*Math.min(1,flowAll);
    const gp=G.position; const liqY=def.baseY+this.level*def.H;

    // ice cubes
    this.ice.forEach((m,i)=>{ const u=m.userData; const floatY=liqY-u.s*0.28+Math.sin(t*2.2+u.ph)*0.008; const target=this.level>0.03?Math.max(u.rest,floatY):u.rest;
      if(u.y>target+0.002){ u.vy-=8*dt; u.y+=u.vy*dt; if(u.y<=target){ if(!u.wet&&this.level>0.03){ for(let k=0;k<6;k++) this.emitDrop(new V3(gp.x+u.x,liqY+0.02,gp.z+u.z),new V3(rand(-0.8,0.8),rand(0.8,1.6),rand(-0.4,0.6)),rand(0.015,0.03),pick(['#ffffff','#E9F7FF']),liqY-0.02); } u.wet=u.wet||this.level>0.03; u.y=target; u.vy=0; } }
      else { u.y=lerp(u.y,target,clamp(dt*6,0,1)); if(this.level>0.03) u.wet=true; }
      m.position.set(u.x,u.y,u.z); m.rotation.set(u.rx+Math.sin(t*1.7+u.ph)*0.05,u.ry,Math.cos(t*1.3+u.ph)*0.05); });

    // bottles
    const gTop=this.glassTopY();
    for(const f of ALL_FRUITS){
      const b=this.bottles[f]; const tl=clamp(this.tilt[f]||0,0,1); const k=easeInOut(tl); const s=b.side;
      const ix=b.home?s*1.13:s*0.95, iy=b.home?1.34+Math.sin(t*1.6+s)*0.015:-0.25, iz=b.home?0.6:1.45;
      b.g.visible=b.home||tl>0.002||(this.flow[f]||0)>0;
      const px=gp.x+s*0.42, py=gTop+0.36, pz=0.18;
      b.g.position.set(lerp(ix,px,k),lerp(iy,py,k)+Math.sin(k*Math.PI)*0.35,lerp(iz,pz,k));
      b.g.rotation.set(0,s*0.18*(1-k),s*2.02*k+Math.sin(t*1.3+s)*0.02*(1-k));
      const st=this.streams[f]; const fl=this.flow[f]||0;
      if(fl>0.02 && G.visible){
        b.g.updateMatrixWorld(); const a=b.g.localToWorld(this.tmp.set(0,0.03,0)).clone();
        const e=new V3(gp.x+s*0.05,liqY,gp.z);
        const dir=e.clone().sub(a); const len=dir.length(); dir.normalize();
        st.visible=true; st.position.copy(a).addScaledVector(dir,len/2);
        st.quaternion.setFromUnitVectors(new V3(0,1,0),dir);
        const w=0.034*Math.sqrt(fl); st.scale.set(w,len,w); st.material.uniforms.uTime.value=t;
        if(Math.random()<fl*0.9){ for(let i=0;i<2;i++) this.emitDrop(e.clone().add(new V3(rand(-0.05,0.05),0.01,rand(-0.05,0.05))),new V3(rand(-0.7,0.7),rand(0.6,1.5),rand(-0.3,0.4)),rand(0.012,0.028),Math.random()<0.5?'#ffffff':FRUIT[f].liquid,e.y-0.02); }
      } else st.visible=false;
    }
    if(this.level>0.04 && G.visible && Math.random()<(0.25+this.foam*6+flowAll*0.6)*dt*20){
      const a=rand(0,Math.PI*2), r=Math.sqrt(Math.random())*rr*0.85;
      this.emitDrop(new V3(gp.x+Math.cos(a)*r,surfY+0.005,gp.z+Math.sin(a)*r),new V3(rand(-0.1,0.1),rand(0.35,0.8),rand(-0.1,0.1)),rand(0.008,0.016),'#ffffff',surfY-0.01);
    }
    for(let i=0;i<this.dropData.length;i++){
      const d=this.dropData[i];
      if(d.life>0){ d.life-=dt; d.v.y-=5.5*dt; d.p.addScaledVector(d.v,dt); if(d.p.y<d.floor && d.v.y<0) d.life=0; }
      const s=d.life>0?d.s*Math.min(1,d.life*5):0;
      this.m4.compose(d.p,this.q,this.sc.set(s,s,s)); this.drops.setMatrixAt(i,this.m4);
    }
    this.drops.instanceMatrix.needsUpdate=true;
    for(let i=0;i<this.gbData.length;i++){
      const b=this.gbData[i]; let s=0;
      if(this.level>0.05 && G.visible){
        b.y+=b.sp*dt*(1+flowAll); if(b.y>this.level-0.015){ b.y=rand(0,0.4)*this.level; b.a=rand(-1.05,1.05); }
        const r=def.r(b.y)-0.002; const wob=Math.sin(t*3+i)*0.01;
        this.sv.set(gp.x+Math.sin(b.a)*r+wob,def.baseY+b.y*def.H,gp.z+Math.cos(b.a)*r); s=b.s;
      }
      this.m4.compose(this.sv,this.q,this.sc.set(s,s,s)); this.gb.setMatrixAt(i,this.m4);
    }
    this.gb.instanceMatrix.needsUpdate=true;

    if(this.cust) this.updateCustomer(this.cust,dt);
    for(const d of this.decor){ const u=d.userData; d.position.y=u.base.y+Math.sin(t*0.9+u.ph)*0.08; d.rotation.y=t*u.spin; d.rotation.z=Math.sin(t*0.7+u.ph)*0.12; }
    if(this.shop.record.visible) this.recDisc.rotation.y=-t*3.5;
    if(this.shop.neon.visible) this.neonFace.material.opacity=0.88+0.12*Math.sin(t*23)*(Math.sin(t*0.7)>0.93?1:0.1);
    if(this.shop.lamp.visible) this.lampGlows.forEach((g,i)=>g.material.opacity=0.5+0.06*Math.sin(t*2+i));
    this.bgbTimer-=dt; if(this.bgbTimer<=0){ this.bgbTimer=rand(0.6,1.3); this.spawnBg(false); }
    this.twTimer-=dt; if(this.twTimer<=0){ this.twTimer=rand(0.25,0.6); this.sparks.emit(new V3(rand(-3,3),rand(1,5.5),rand(-3.9,-3.0)),new V3(0,0.05,0),{size:rand(0.12,0.26),life:rand(0.9,1.6),color:pick(['#FFF4D6','#FFD7D0','#E9F5C0']),twinkle:1,alpha:0.9}); }
    if(this.cust && this.cust.special && Math.random()<dt*7){ const p=this.cust.g.position.clone().add(new V3(rand(-0.5,0.5),rand(1.3,1.9),0.3)); this.sparks.emit(p,new V3(0,0.25,0),{size:rand(0.1,0.2),life:0.8,color:'#FFE27A',twinkle:1}); }
    this.sparks.update(dt,t); this.bgb.update(dt,t);

    const A=this.anchors;
    if(A.bubble&&this.cust){ const ch=A.bubble.firstElementChild; if(ch) this.placeBubble(A.bubble,ch); else this.bubEl=null; }
    if(A.judge) this.place(A.judge,this.tmp.set(gp.x,def.baseY+def.H*0.42,gp.z));
    if(A.labels){ A.labels.forEach((el,i)=>{ if(!el) return; const L2=this.lines[i]; if(!L2||!G.visible||this.glassAnim.kind!=='idle'){ el.style.visibility='hidden'; return; } el.style.visibility='visible'; this.place(el,this.tmp.set(gp.x+def.r(L2.top)+def.wall+0.05,def.baseY+L2.top*def.H,gp.z),16,0); }); }
  }
  placeBubble(anchor,ch){
    const h=this.cust.g.position; const cv=this.renderer.domElement;
    const hudEl=cv.parentElement&&cv.parentElement.querySelector('.hud-top');
    const hudB=hudEl?hudEl.getBoundingClientRect().bottom-cv.getBoundingClientRect().top:0;
    if(ch!==this.bubEl){ this.bubEl=ch; ch.style.maxWidth=''; this.bubSide=null; }
    const above=this.project(this.tmp.set(h.x,h.y+2.0,h.z));
    if(!this.bubSide){
      if(above.y-ch.offsetHeight-8>=hudB) this.bubSide='top';
      else { const r=this.project(this.tmp.set(h.x+0.52,h.y+1.05,h.z)).x, l=this.project(this.tmp.set(h.x-0.52,h.y+1.05,h.z)).x; const roomR=this.w-r-18, roomL=l-18; this.bubSide=roomR>=roomL?'right':'left'; this.bubRoom=Math.max(roomR,roomL); }
      anchor.dataset.side=this.bubSide;
    }
    let x,y;
    if(this.bubSide==='top'){ const hw=ch.offsetWidth/2; x=clamp(above.x,hw+10,this.w-hw-10); y=Math.max(above.y,hudB+8+ch.offsetHeight); }
    else { const right=this.bubSide==='right'; ch.style.maxWidth=Math.max(104,Math.floor(this.bubRoom))+'px'; const e=this.project(this.tmp.set(h.x+(right?0.5:-0.5),h.y+1.05,h.z)); x=e.x+(right?10:-10); y=Math.max(e.y,hudB+8+ch.offsetHeight/2); }
    anchor.style.transform=`translate3d(${x.toFixed(1)}px,${y.toFixed(1)}px,0)`;
  }
  updateCustomer(c,dt){
    c.t+=dt; const g=c.g; const P=c.parts; const t=this.time;
    let y=0.78, rz=0;
    if(c.state==='walk'){ const k=clamp(c.t/c.dur,0,1); c.x=lerp(c.from,c.to,c.leaving?k*k:1-Math.pow(1-k,2)); y+=Math.abs(Math.sin(c.t*13))*0.1; rz=Math.sin(c.t*13)*0.07;
      if(k>=1){ if(c.leaving){ this.removeCustomer(c); return; } c.state='idle'; c.t=0; } }
    else { y+=Math.sin(t*2.4)*0.02; }
    let armL=0.35, armR=-0.35, headRz=Math.sin(t*1.3)*0.05, headRy=0;
    if(c.react){ c.rt+=dt; const r=c.rt;
      if(c.react==='happy'){ if(r<1.3){ y+=Math.abs(Math.sin(r*Math.PI*2.3))*0.32*(1-r/1.4); armL=2.5; armR=-2.5; headRz=Math.sin(r*12)*0.12; } }
      else if(c.react==='ok'){ if(r<1.0){ y+=Math.abs(Math.sin(r*Math.PI*2))*0.12; armL=1.2; armR=-0.4; } }
      else if(c.react==='sad'){ headRy=Math.sin(r*18)*0.35*Math.exp(-r*2); armL=0.1; armR=-0.1; headRz=0.15; }
    }
    g.position.set(c.x,y,-2.35); g.rotation.z=rz;
    P.head.rotation.set(0,headRy,headRz);
    P.arms[0].rotation.z=lerp(P.arms[0].rotation.z,-armL,0.25); P.arms[1].rotation.z=lerp(P.arms[1].rotation.z,-armR,0.25);
    c.blink-=dt; const bl=c.blink<0.12&&c.blink>0?0.15:1; if(c.blink<0) c.blink=rand(2,4.5);
    for(const e of P.eyes) e.scale.y=0.06*bl;
    if(P.crown) P.crown.rotation.y=t*0.8;
  }
  render(){ this.renderer.render(this.scene,this.camera); }
}

/* =========================================================
   Game logic
   ========================================================= */
class Game{
  constructor(engine,sfx,emit){
    this.e=engine; this.sfx=sfx; this.emit=emit;
    this.mode='demo'; this.paused=false; this.day=1;
    this.tilt={}; this.flow={}; this.active=null;
    this.ctx={opts:{ice:true,mix:true},owned:{},perks:perksOf({})};
    this.resetGlass(); this.order=null; this.phase='idle'; this.phaseT=0;
  }
  resetGlass(){ this.level=0; this.foam=0; this.segs=[]; this.amt={}; this.vol={}; this.foamSpill=false; this.spillBig=false; this.iceCount=0; this.icePending=0; this.lateIce=false; }
  get tol(){ return Math.max(0.018,0.032-0.003*(this.day-1)); }
  get foamMul(){ const o=this.order; const fm=o?Math.max(FRUIT[o.A].foamMul,FRUIT[o.B].foamMul):1; return (1+0.08*Math.max(0,this.day-2))*fm; }

  startDemo(){ this.mode='demo'; this.active=null; this.demoIdx=(this.demoIdx||0); this.startDemoOrder(); }
  startDemoOrder(){
    const glasses=['tumbler','goblet','flute','coupe','mug']; const g=glasses[this.demoIdx%glasses.length]; this.demoIdx++;
    const owned=EXTRA_FRUITS.filter(f=>this.ctx.owned[f]);
    let first=this.demoIdx%2?'peach':'pear', second=first==='peach'?'pear':'peach';
    if(owned.length&&this.demoIdx%3===0) second=pick(owned);
    const a=g==='coupe'?0.45:0.42, b=g==='flute'?0.72:0.8;
    const layers=[{fruit:first,top:a},{fruit:second,top:b}];
    this.order={glass:g,kind:'layer',layers,lines:layers.map(L=>({top:L.top,color:FRUIT[L.fruit].line,label:FRUIT[L.fruit].name})),A:first,B:second,ice:0,n:2,species:SPECIES_KEYS[this.demoIdx%6],special:false,patienceMax:99,req:{}};
    this.resetGlass(); this.e.setGlass(g); this.e.setLines(this.order.lines); this.e.glassIn(); this.e.customerEnter(this.order.species,this.demoIdx%5===0);
    this.demoStep=0; this.demoT=0;
  }
  updateDemo(dt){
    this.demoT+=dt; const L=this.order.layers;
    switch(this.demoStep){
      case 0: if(this.demoT>1.1){ this.demoStep=1; this.demoT=0; } break;
      case 1: this.active=L[0].fruit; if(this.level>=L[0].top-0.035){ this.active=null; this.demoStep=2; this.demoT=0; } break;
      case 2: if(this.demoT>0.9){ this.demoStep=3; this.demoT=0; } break;
      case 3: this.active=L[1].fruit; if(this.level>=L[1].top-0.035||this.level+this.foam>0.97){ this.active=null; this.demoStep=4; this.demoT=0; } break;
      case 4: if(this.demoT>1.3){ if(this.level<L[1].top-0.05){ this.demoStep=3; this.demoT=0; break; } this.e.glassServe(); this.e.customerReact('happy'); this.e.burst('perfect'); this.demoStep=5; this.demoT=0; } break;
      case 5: if(this.demoT>1.5){ this.e.customerExit(); this.e.glassOut(true); this.demoStep=6; this.demoT=0; } break;
      case 6: if(this.demoT>0.9) this.startDemoOrder(); break;
    }
  }

  setContext(ctx){ this.ctx={...ctx,perks:perksOf(ctx.owned)}; }
  startDay(day){
    this.mode='play'; this.day=day; this.dayLeft=DAY_LEN; this.lastCall=false;
    this.sales=0; this.combo=0; this.maxCombo=0; this.served=0; this.perfects=0; this.tips=0; this.legends=0; this.orderCount=0;
    this.active=null; this.prevSpecies=null; this.order=null;

  nextOrder(){
    const o=makeOrder(this.day,this.prevSpecies,{...this.ctx,simple:this.day===1&&this.orderCount<2}); this.prevSpecies=o.species; this.orderCount++;
    this.order=o; this.patience=o.patienceMax; this.resetGlass(); this.active=null; this.flow={};
    this.e.setGlass(o.glass); this.e.setLines(o.lines); this.e.glassIn(); this.e.customerEnter(o.species,o.special);

  press(f){ if(this.mode!=='play'||(this.phase!=='pour'&&this.phase!=='enter')) return; this.active=f; }
  release(f){ if(this.active===f) this.active=null; }
  canPour(){ return this.mode==='demo'||(this.mode==='play'&&this.phase==='pour'); }
  canServe(){ return this.mode==='play'&&this.phase==='pour'&&this.level>0.04; }
  canIce(){ return this.mode==='play'&&(this.phase==='pour'||this.phase==='enter')&&this.iceCount<ICE_MAX&&this.level<0.97; }
  mixShare(){ const o=this.order; if(!o||o.kind!=='mix') return null; const a=this.vol[o.A]||0, b=this.vol[o.B]||0; return a+b>0.0005?a/(a+b):null; }
  tolFor(o){ return this.tol*(o&&o.kind==='mix'?1.6:1); }
  nextFruit(){
    const o=this.order; if(!o||this.mode!=='play') return null; const tol=this.tolFor(o);
    if(o.kind==='mix'){ if(this.level>=o.total-tol*0.8) return null; const a=this.vol[o.A]||0, b=this.vol[o.B]||0, s=a+b; if(s<0.0005) return o.ratio>=0.5?o.A:o.B; return (a/s<o.ratio)?o.A:o.B; }
    for(const L of o.layers){ if(this.level<L.top-tol*0.8) return L.fruit; }
    return null;
  }
  needIce(){ const o=this.order; return !!(o&&this.mode==='play'&&this.iceCount<o.ice); }
  tutorialTip(){
    if(this.mode!=='play'||this.day!==1||this.served>=2||this.phase!=='pour') return '';
    const nf=this.nextFruit();
    if(this.active) return '線の少し手前で指をはなす！';
    if(nf&&this.level<0.03) return `「${FRUIT[nf].name}」のボタンを長押しして注ごう`;
    if(!nf) return '線まで来たら「どうぞ！」で出そう';

  }
  serve(){ if(!this.canServe()) return; this.judge('serve'); }
  addIce(){
    if(!this.canIce()) return false;
    this.iceCount++; this.e.addIce(); this.sfx.clink();
    const vol=GLASSES[this.order.glass].V*ICE_FRAC;
    if(this.level>0.04){ this.lateIce=true; const top=this.segs.length?this.segs[this.segs.length-1].fruit:this.order.A; this.addVolume(top,vol,false); this.foam+=0.06*this.foamMul; }
    else this.icePending+=vol;
    return true;
  }
  addVolume(f,vol,liquid=true){
    const g=GLASSES[this.order.glass]; let rest=vol;
    if(liquid) this.vol[f]=(this.vol[f]||0)+vol;
    while(rest>1e-7){ const step=Math.min(rest,g.V*0.01); const r=g.r(this.level); let dl=step/(r*r);
      if(this.level+dl>=1){ dl=Math.max(0,1-this.level); this.spillBig=true; rest=0; } else rest-=step;
      this.level+=dl; this.amt[f]=(this.amt[f]||0)+dl; }

    if(last&&last.fruit===f) last.top=this.level; else if(this.segs.length<6) this.segs.push({fruit:f,top:this.level}); else last.top=this.level;
  }
  updatePour(dt){
    const can=this.canPour(); let flowAll=0;
    for(const f of ALL_FRUITS){
      const holding=can&&this.active===f;
      const tl=clamp((this.tilt[f]||0)+(holding?dt/0.16:-dt/0.22),0,1); this.tilt[f]=tl;
      const target=holding?smooth(0.7,1,tl):0;
      const k=1-Math.exp(-dt/(holding?0.05:0.065));
      let fl=(this.flow[f]||0); fl+=(target-fl)*k; if(!holding&&fl<0.004) fl=0; this.flow[f]=fl;

      if(this.level+this.foam>1.012){ this.foam=Math.max(0,1.012-this.level); if(this.mode==='play'&&this.phase==='pour'&&!this.foamSpill){ this.foamSpill=true; this.emit('foamspill'); } if(Math.random()<0.5) this.e.spillFX('#ffffff'); }
      if(this.spillBig&&Math.random()<0.7) this.e.spillFX(FRUIT[this.segs[this.segs.length-1]?.fruit||'peach'].liquid);
    }
    const o=this.order; const mix=o&&o.kind==='mix'?{a:o.A,b:o.B,wa:this.mixShare()??o.ratio}:null;
    this.e.setLiquid(this.level,this.foam,this.segs,mix); this.e.setPour(this.tilt,this.flow);
    this.sfx.setLevels(Math.min(1,flowAll),this.level>0.03?Math.min(1,0.25+this.foam*5):0);
  }

  update(dt){
    if(this.mode==='demo') this.updateDemo(dt);
    if(this.mode==='play'){
      if(!this.lastCall){ this.dayLeft-=dt; if(this.dayLeft<=0){ this.dayLeft=0; this.lastCall=true; this.emit('lastcall'); } }
      this.phaseT+=dt;
      if(this.phase==='gap'){ this.phaseT-=2*dt; if(this.phaseT<=0) this.nextOrder(); }
      else if(this.phase==='enter'){ if(this.phaseT>0.85){ this.phase='pour'; this.phaseT=0; this.emit('say',{text:orderSay(this.order),kind:this.order.special?'gold':''}); } }
      else if(this.phase==='pour'){
        this.patience-=dt;
        if(this.spillBig) this.judge('spill');
        else if(this.patience<=0){ this.patience=0; this.judge('timeout'); }
        else if(this.patience/this.order.patienceMax<0.3&&!this.order.warned){ this.order.warned=true; this.emit('say',{text:'まだかなぁ…',kind:''}); }
      }
      else if(this.phase==='judge'){ if(this.phaseT>1.5){ this.phase='exit'; this.phaseT=0; this.e.customerExit(); this.e.glassOut(this.lastGrade!=='timeout'); } }
      else if(this.phase==='exit'){ if(this.phaseT>0.75){ if(this.lastCall) this.endDay(); else this.nextOrder(); } }
    }
    this.updatePour(dt);

  judge(kind){
    const o=this.order; this.active=null; const nm=f=>FRUIT[f].name;
    let grade, hint='';

    else if(this.spillBig) grade='spill';

      } else {
        const fr=new Set([...Object.keys(o.req),...Object.keys(this.amt)]);

        dev=Math.abs(wd); if(worst) hint=`${nm(worst)}がちょっと${wd>0?'多め':'少なめ'}`;

      if(this.iceCount!==o.ice){ grade=DOWN[grade]; hint=o.ice?`氷は${o.ice}個だよ`:'氷はいらなかったかも'; }
      if(this.foamSpill){ grade=DOWN[grade]; hint='泡があふれちゃった'; }
      if(grade==='perfect') hint='';

    }

    if(good){ this.combo++; this.maxCombo=Math.max(this.maxCombo,this.combo); } else this.combo=0;
    let y=base*gm; if(gm>0){ y*=1+0.2*(this.patience/o.patienceMax); if(good) y*=(1+0.05*Math.min(this.combo,10))*this.ctx.perks.tip; y*=this.ctx.perks.sales; }

    if(grade!=='timeout') this.e.glassServe();
    this.e.customerReact(grade==='perfect'?'happy':grade==='good'||grade==='close'?'ok':'sad');
    if(grade==='perfect'){ this.e.burst(legendary?'legend':'perfect'); this.e.customerBurst(); }
    else if(grade==='good') this.e.burst('good');
    if(legendary) this.sfx.legend(); else if(grade==='perfect') this.sfx.perfect(); else if(grade==='good') this.sfx.good(); else if(grade==='spill') this.sfx.spill(); else this.sfx.bad();
    if(navigator.vibrate&&grade==='perfect'){ try{ navigator.vibrate(legendary?[30,40,30,40,60]:25); }catch(e){} }
    const lead=o.kind==='mix'?o.A:(o.layers?o.layers[0].fruit:o.A);
    this.emit('judge',{grade,yen:y,combo:this.combo,hint,legendary,special:o.special,fruitName:FRUIT[lead].name,species:o.species,glass:o.glass});
    this.emit('say',{text:legendary?'きらめいてる…！最高よ！':pick(LINES[grade]),kind:legendary?'gold':''});
  }
  endDay(){
    this.mode='dayEnd'; this.order=null; this.active=null;
    const goal=dayGoal(this.day);
    const stars=this.sales>=goal*2?3:this.sales>=goal*1.5?2:this.sales>=goal?1:0;
    this.sfx.fanfare(stars>0);

}

function glassPathD(def,inner,sx,sy,ox,oy){
  const N=24, pts=[];
  const X=x=>ox+x*sx, Y=y=>oy-y*sy;
  if(inner){ for(let i=0;i<=N;i++){ const y=i/N; pts.push([X(-def.r(y)),Y(def.baseY+y*def.H)]); } for(let i=N;i>=0;i--){ const y=i/N; pts.push([X(def.r(y)),Y(def.baseY+y*def.H)]); } }
  else { const w=def.wall; const R=y=>def.r(y)+w;
    if(def.stem){ const s=def.stem; pts.push([X(-s.foot),Y(0)],[X(-s.foot),Y(0.03)],[X(-s.r),Y(0.18)],[X(-s.r),Y(def.baseY-0.1)]); }
    else pts.push([X(-R(0)),Y(0)]);
    for(let i=0;i<=N;i++){ const y=i/N; pts.push([X(-R(y)),Y(def.baseY+y*def.H)]); }
    for(let i=N;i>=0;i--){ const y=i/N; pts.push([X(R(y)),Y(def.baseY+y*def.H)]); }
    if(def.stem){ const s=def.stem; pts.push([X(s.r),Y(def.baseY-0.1)],[X(s.r),Y(0.18)],[X(s.foot),Y(0.03)],[X(s.foot),Y(0)]); }
    else pts.push([X(R(0)),Y(0)]);
  }
  return 'M'+pts.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join('L')+'Z';
}

  const s=Math.min((h-4)/top,(w-4)/(2*maxR)); const ox=w/2-(def.handle?4:0), oy=h-2;

function Transfer({save,onLoad}){
  const [mode,setMode]=useState(null);

  const [input,setInput]=useState('');
  const [msg,setMsg]=useState('');

  const load=()=>{
    const s=codeToSave(input);

    if(!arm){ setArm(true); setMsg(`${s.unlocked}日目まで・資金 ${yen(s.wallet)} のデータです。もう一度押すと、今のデータを上書きします`); return; }

    ${msg&&html`<p className="note" style=${{textAlign:'left'}}>${msg}</p>`}
  </div>`;
}

function Ranking({save,cloud,onNick,onClose}){
  const [rows,setRows]=useState(null);
  const [nick,setNick]=useState(save.nick||'');
  const [err,setErr]=useState('');
  useEffect(()=>{
    if(!Cloud.db) return;
    let un=()=>{};
    try{ un=Cloud.db.collection('scores').orderBy('best','desc').limit(30).onSnapshot(s=>setRows(s.docs.map(d=>({id:d.id,...d.data()}))),e=>setErr('ランキングを読み込めませんでした')); }catch(e){ setErr('ランキングを読み込めませんでした'); }

  },[cloud.status]);
  const off=cloud.status!=='ready';
  const canPost=!off&&!!Cloud.uid&&cloud.canWrite!==false;
  return html`<div className="sheet" onClick=${e=>{ if(e.target===e.currentTarget) onClose(); }}><div className="card wide">
    <h2>みんなのランキング</h2>

        ${!save.nick&&html`<p className="note" style=${{margin:'2px 0 8px',textAlign:'left'}}>名前を決めると、閉店のたびに記録が自動で登録されます。</p>`}
      </div>`:html`<p className="note">この開き方では見るだけです。記録を登録するには、持ち主から編集者として招待してもらってください。</p>`}
      ${err?html`<p className="note">${err}</p>`:rows==null?html`<p className="note">読み込み中…</p>`:rows.length===0?html`<p className="note">まだ誰も登録していません。1日遊んで、最初の記録を残そう。</p>`:html`
        <ol className="rank">${rows.map((r,i)=>html`<li key=${r.id} className=${r.id===Cloud.uid?'me':''}>
          <span className=${'no'+(i<3?' top':'')}>${i+1}</span>
          <span className="nm">${String(r.nick||'名無しの店長').slice(0,12)}${r.id===Cloud.uid?'（あなた）':''}<span className="sub">${Number(r.bestDay)||0}日目まで・累計 ${yen(Number(r.total)||0)}</span></span>
          <span className="sc">${yen(Number(r.best)||0)}</span></li>`)}</ol>`}
    `}
    <button className="cta" style=${{marginTop:'14px'}} onClick=${onClose}>とじる</button>
  </div></div>`;
}

function App(){
  const canvasRef=useRef(null), bubbleRef=useRef(null), judgeRef=useRef(null), labelRefs=useRef([]);
  const R=useRef({});
  const [save,setSave]=useState(loadLocal);
  const saveRef=useRef(save); saveRef.current=save;
  const [screen,setScreen]=useState('title');
  const [day,setDay]=useState(()=>loadLocal().unlocked);
  const [hud,setHud]=useState({time:1,left:DAY_LEN,sales:0,patience:1,next:null,canServe:false,tip:'',share:null,ice:0,needIce:false});
  const [order,setOrder]=useState(null);
  const [bubble,setBubble]=useState(null);
  const [judge,setJudge]=useState(null);
  const [legend,setLegend]=useState(null);
  const [banner,setBanner]=useState(null);
  const [result,setResult]=useState(null);
  const [modal,setModal]=useState(null);
  const [held,setHeld]=useState(null);
  const [cloud,setCloud]=useState({status:'loading',canWrite:null});
  const [rankNote,setRankNote]=useState('');
  const handlers=useRef(()=>{});

  const update=(fn,{cloudSave=false}={})=>{ setSave(s=>{ const n=normSave(fn(s)); n.updatedAt=Date.now(); writeLocal(n); if(cloudSave) Cloud.saveProgress(n); return n; }); };

  handlers.current=(type,p)=>{
    if(type==='order'){ setOrder(p); setJudge(null); }
    else if(type==='say'){ setBubble({...p,id:Math.random()}); }
    else if(type==='judge'){ setJudge({...p,id:Math.random()}); setHeld(null);
      if(p.legendary) setLegend({name:`きらめき${p.fruitName}ソーダ`,id:Math.random()});
      update(s=>{ const n={...s,species:{...s.species},glasses:{...s.glasses}}; if(p.grade!=='timeout'){ n.species[p.species]=(n.species[p.species]||0)+1; n.glasses[p.glass]=(n.glasses[p.glass]||0)+1; } if(p.legendary) n.legend=(n.legend||0)+1; return n; }); }
    else if(type==='lastcall'){ setBanner({text:'ラストオーダー！',id:Math.random()}); }
    else if(type==='foamspill'){ setBanner({text:'泡があふれた！',id:Math.random(),small:true}); }
    else if(type==='dayEnd'){
      setOrder(null); setBubble(null);
      const prevBest=Math.max(0,...Object.values(saveRef.current.best||{}).map(Number));
      update(s=>{ const n={...s,best:{...s.best},stars:{...s.stars}}; n.best[p.day]=Math.max(n.best[p.day]||0,p.sales); n.stars[p.day]=Math.max(n.stars[p.day]||0,p.stars); if(p.passed) n.unlocked=Math.max(n.unlocked,p.day+1); n.wallet=(n.wallet||0)+p.sales; n.total=(n.total||0)+p.sales; return n; },{cloudSave:true});
      setResult({...p,newBest:p.sales>prevBest&&p.sales>0}); setScreen('result'); setRankNote('');
      setTimeout(()=>{ const s=saveRef.current; if(s.nick&&Cloud.status==='ready'){ Cloud.submitScore(s).then(ok=>setRankNote(ok?'ランキングに記録しました':'')); } },300);
    }
  };

  useEffect(()=>{ if(!bubble) return; const id=setTimeout(()=>setBubble(b=>b&&b.id===bubble.id?null:b),2600); return ()=>clearTimeout(id); },[bubble]);
  useEffect(()=>{ if(!judge) return; const id=setTimeout(()=>setJudge(j=>j&&j.id===judge.id?null:j),1700); return ()=>clearTimeout(id); },[judge]);
  useEffect(()=>{ if(!legend) return; const id=setTimeout(()=>setLegend(null),2700); return ()=>clearTimeout(id); },[legend]);
  useEffect(()=>{ if(!banner) return; const id=setTimeout(()=>setBanner(null),banner.small?1000:1600); return ()=>clearTimeout(id); },[banner]);

  // keep the scene and game in step with purchases and options
  useEffect(()=>{ const g=R.current; if(!g.engine) return; g.engine.setShop(save.owned); g.game.setContext({opts:save.opts,owned:save.owned}); g.sfx.setMuted(save.muted); g.sfx.setBgm(!!save.owned.record&&save.bgm); },[save.owned,save.opts,save.muted,save.bgm]);

  useEffect(()=>{
    const engine=new Engine(canvasRef.current); const sfx=new Sfx(); const s0=saveRef.current; sfx.setMuted(s0.muted);
    const game=new Game(engine,sfx,(t,p)=>handlers.current(t,p));
    engine.anchors={bubble:bubbleRef.current,judge:judgeRef.current,labels:labelRefs.current};
    R.current={engine,game,sfx};
    engine.setShop(s0.owned); game.setContext({opts:s0.opts,owned:s0.owned}); sfx.setBgm(!!s0.owned.record&&s0.bgm);
    const host=canvasRef.current.parentElement;
    const doResize=()=>{ const r=host.getBoundingClientRect(); engine.resize(Math.max(1,r.width),Math.max(1,r.height)); };
    doResize(); const ro=new ResizeObserver(doResize); ro.observe(host);
    game.startDemo();
    let last=performance.now(), raf=0, acc=0;
    const poll=()=>{ const g=game; const play=g.mode==='play'; const n={time:play?g.dayLeft/DAY_LEN:1,left:play?Math.ceil(g.dayLeft):DAY_LEN,sales:g.sales||0,patience:g.order&&play?clamp(g.patience/g.order.patienceMax,0,1):1,next:g.phase==='pour'?g.nextFruit():null,canServe:g.canServe(),tip:g.tutorialTip(),share:play?g.mixShare():null,ice:g.iceCount||0,needIce:g.phase==='pour'&&g.needIce(),canIce:g.canIce()};
      if(n.share!=null) n.share=Math.round(n.share*200)/200;
      setHud(h=>{ for(const k in n) if(h[k]!==n[k]) return n; return h; });
      const st=host.getBoundingClientRect(), top=play&&document.querySelector('.hud-top'), bot=play&&document.querySelector('.hud-bottom');
      engine.setInsets(top?Math.max(0,top.getBoundingClientRect().bottom-st.top):0, bot?Math.max(0,st.bottom-bot.getBoundingClientRect().top):0); };
    const loop=(now)=>{ const dt=Math.min(0.05,(now-last)/1000); last=now; if(!game.paused) game.update(dt); engine.update(game.paused?0:dt); engine.render(); acc+=dt; if(acc>0.08){ acc=0; poll(); } raf=requestAnimationFrame(loop); };
    raf=requestAnimationFrame(loop);
    const fontsP=document.fonts&&document.fonts.load?Promise.all([document.fonts.load('700 86px "Kaisei Decol"'),document.fonts.load('italic 34px "DM Serif Display"')]):Promise.resolve();
    fontsP.then(()=>engine.refreshLabels()).catch(()=>{});
    const vis=()=>{ if(document.hidden&&game.mode==='play'&&!game.paused){ game.paused=true; game.active=null; setModal('pause'); } };
    document.addEventListener('visibilitychange',vis);
    const keyFruit=code=>{ const c=counterOf(saveRef.current.owned); if(code==='ArrowLeft'||code==='KeyA') return c[0]; if(code==='ArrowRight'||code==='KeyD') return c[c.length-1]; const m=/^Digit([1-5])$/.exec(code); return m?c[Number(m[1])-1]||null:null; };
    const kd=e=>{ if(e.target&&e.target.tagName==='INPUT') return; if(e.repeat) return; const f=keyFruit(e.code); if(f){ sfx.init(); game.press(f); setHeld(game.active); e.preventDefault(); } else if(e.code==='Space'||e.code==='Enter'){ if(game.mode==='play'){ game.serve(); e.preventDefault(); } } else if(e.code==='KeyI'||e.code==='KeyS'){ if(game.mode==='play'&&saveRef.current.opts.ice) game.addIce(); } };
    const ku=e=>{ const f=keyFruit(e.code); if(f){ game.release(f); setHeld(game.active); } };
    window.addEventListener('keydown',kd); window.addEventListener('keyup',ku);
    // account features: ranking + progress that follows the viewer
    const offCloud=Cloud.on(()=>setCloud({status:Cloud.status,canWrite:Cloud.canWrite}));
    Cloud.init().then(async()=>{ const remote=await Cloud.loadSave(); if(remote&&(remote.updatedAt||0)>(saveRef.current.updatedAt||0)){ const n=normSave(remote); writeLocal(n); setSave(n); setDay(n.unlocked); } });
    return ()=>{ cancelAnimationFrame(raf); ro.disconnect(); offCloud(); document.removeEventListener('visibilitychange',vis); window.removeEventListener('keydown',kd); window.removeEventListener('keyup',ku); engine.renderer.dispose(); };
  },[]);

  const G=()=>R.current;
  const down=f=>e=>{ e.preventDefault(); try{ e.currentTarget.setPointerCapture(e.pointerId); }catch(_){} G().sfx.init(); G().game.press(f); setHeld(G().game.active); };
  const up=f=>()=>{ G().game.release(f); setHeld(G().game.active); };
  const goIntro=d=>{ G().sfx.init(); G().sfx.tap(); setDay(d); setResult(null); setModal(null); setScreen('intro'); };
  const begin=()=>{ G().sfx.tap(); setJudge(null); setBubble(null); setOrder(null); G().game.startDay(day); setScreen('play'); };
  const toTitle=()=>{ setModal(null); setResult(null); setOrder(null); setBubble(null); setJudge(null); const g=G().game; g.paused=false; g.startDemo(); setScreen('title'); };
  const pause=()=>{ const g=G().game; g.paused=true; g.active=null; setHeld(null); setModal('pause'); };
  const resume=()=>{ G().game.paused=false; setModal(null); };
  const open=m=>{ G().sfx.init(); setModal(m); };
  const buy=(key,price)=>{ if(save.wallet<price||save.owned[key]) return; G().sfx.coin(); update(s=>({...s,wallet:s.wallet-price,owned:{...s.owned,[key]:true}}),{cloudSave:true}); };
  const setNick=n=>{ update(s=>({...s,nick:n}),{cloudSave:true}); setTimeout(()=>Cloud.submitScore(saveRef.current),200); };
  const setOpt=(k,v)=>update(s=>({...s,opts:{...s.opts,[k]:v}}),{cloudSave:true});
  const loadCode=s=>{ update(()=>s,{cloudSave:true}); setDay(s.unlocked); };

  const goal=dayGoal(day);
  const bestDay=Math.max(0,...Object.keys(save.best).map(Number));
  const counter=counterOf(save.owned); const multi=counter.length>2;
  const iceOn=!!save.opts.ice;

  const Settings=()=>html`<div className="sheet" onClick=${e=>{ if(e.target===e.currentTarget) setModal(screen==='play'?'pause':null); }}><div className="card wide">
    <h2>設定</h2>
    <div className="toggle"><div className="t"><b>氷入りの注文</b><span>「氷×2」のような注文が来る。氷を入れると水位が上がるので、入れる順番がカギ。</span></div><${Switch} id="opt-ice" label="氷入りの注文" on=${save.opts.ice} onChange=${v=>setOpt('ice',v)}/></div>
    <div className="toggle"><div className="t"><b>ミックス注文</b><span>「白桃7：洋梨3」のように混ぜる注文が来る。メーターを見ながら2種類を注ぎ分ける。</span></div><${Switch} id="opt-mix" label="ミックス注文" on=${save.opts.mix} onChange=${v=>setOpt('mix',v)}/></div>
    <div className="toggle"><div className="t"><b>効果音</b><span>注ぐ音や判定の音</span></div><${Switch} id="opt-sound" label="効果音" on=${!save.muted} onChange=${v=>update(s=>({...s,muted:!v}))}/></div>
    <div className="toggle"><div className="t"><b>BGM</b><span>${save.owned.record?'レコードプレーヤーの音楽':'お店で「レコードプレーヤー」を買うと流れる'}</span></div><${Switch} id="opt-bgm" label="BGM" disabled=${!save.owned.record} on=${!!save.owned.record&&save.bgm} onChange=${v=>update(s=>({...s,bgm:v}))}/></div>
    ${screen==='play'&&html`<p className="note">氷・ミックスの設定は、次のお客さんから反映されます。</p>`}
    ${screen!=='play'&&html`<${Transfer} save=${save} onLoad=${loadCode}/>`}
    <button className="cta" style=${{marginTop:'14px'}} onClick=${()=>setModal(screen==='play'?'pause':null)}>とじる</button>
  </div></div>`;

  return html`<div className="stage">
    <canvas ref=${canvasRef} className="gl" aria-label="喫茶店のカウンターとグラス"></canvas>
    <div className="anchors">
      <div className="anchor" ref=${bubbleRef}>${bubble&&screen==='play'&&html`<div key=${bubble.id} className=${'bubble '+(bubble.kind||'')}>${bubble.text}</div>`}</div>
      ${[0,1,2].map(i=>{ const L=order&&order.lines[i]; return html`<div key=${'lb'+i} className="anchor" ref=${el=>{ labelRefs.current[i]=el; }} style=${{visibility:'hidden'}}>${screen==='play'&&L&&html`<div className="tlabel" style=${{'--c':L.color}}>${L.label}</div>`}</div>`; })}
      <div className="anchor" ref=${judgeRef}>${judge&&screen==='play'&&html`<${JudgePop} key=${judge.id} j=${judge}/>`}</div>
    </div>

    ${screen==='play'&&html`<div className="hud-top">
      <div className="hud-row">
        <div className="day-pill">${day}日目</div>
        <div className=${'clock'+(hud.left<=15?' late':'')+(hud.left<=0?' over':'')} role="timer" aria-label="閉店までの時間"><i style=${{width:(hud.time*100).toFixed(1)+'%'}}></i><span>${hud.left>0?`閉店まで ${Math.floor(hud.left/60)}:${String(hud.left%60).padStart(2,'0')}`:'ラストオーダー'}</span></div>
        <button className="icon-btn" onClick=${pause} aria-label="一時停止">${PauseIcon}</button>
      </div>
      <div className="hud-row">
        <div className="sales"><small>売上</small><b>${yen(hud.sales)}</b><div className=${'goalbar'+(hud.sales>=goal?' done':'')}><i style=${{width:Math.min(100,hud.sales/goal*100)+'%'}}></i></div><small>目標 ${yen(goal)}</small></div>
        ${order&&html`<${OrderCard} o=${order} patience=${hud.patience} tip=${hud.tip}/>`}
      </div>
      ${order&&order.kind==='mix'&&html`<${MixMeter} key=${order.id} o=${order} share=${hud.share} tol=${G().game?G().game.tolFor(order):0.03}/>`}
    </div>
    ${(()=>{
      const iceBtn=iceOn&&html`<button className=${'icebtn'+(hud.needIce?' hint':'')} disabled=${!hud.canIce} onClick=${()=>{ G().sfx.init(); G().game.addIce(); }} aria-label="氷を入れる"><${IceIcon}/>氷 ${hud.ice}${order&&order.ice?`/${order.ice}`:''}</button>`;
      const serveBtn=html`<button className=${'serve'+(hud.canServe&&!hud.next&&!hud.needIce?' ready':'')} disabled=${!hud.canServe} onClick=${()=>G().game.serve()}>どうぞ！</button>`;
      const pb=f=>html`<${PourBtn} key=${f} fruit=${f} active=${held===f} hint=${hud.next===f&&!hud.needIce} onDown=${down(f)} onUp=${up(f)}/>`;
      return multi
        ?html`<div className="hud-bottom multi"><div className="action-row">${iceBtn}${serveBtn}</div><div className="pour-row">${counter.map(pb)}</div></div>`
        :html`<div className="hud-bottom">${pb('peach')}<div className="center-col">${iceBtn}${serveBtn}</div>${pb('pear')}</div>`;
    })()}`}

    ${banner&&html`<div className="banner" key=${banner.id}><span style=${banner.small?{fontSize:'18px'}:null}>${banner.text}</span></div>`}
    ${legend&&html`<div className="legend" key=${legend.id}><div className="flash"></div><div className="rays"></div><div className="box"><div className="word">LEGENDARY!</div><span className="sub">${legend.name}</span></div></div>`}

    ${screen==='title'&&html`<div className="title">
      <div className="marquee">
        <div className="eyebrow">果実喫茶</div>
        <h1>しゅわっと</h1>
        <div className="ribbon">Sparkling Café</div>
        <p className="sub">白桃と洋梨のソーダを、<br/>注文の線ぴったりに注いでおもてなし</p>
      </div>
      <div className="corner"><button className="icon-btn" onClick=${()=>open('settings')} aria-label="設定">${GearIcon}</button></div>
      <div className="title-bottom">
        <div className="title-meta">
          <div className="day-pick">
            <button onClick=${()=>setDay(d=>Math.max(1,d-1))} disabled=${day<=1} aria-label="前の日">‹</button>
            <span>${day}日目</span>
            <button onClick=${()=>setDay(d=>Math.min(save.unlocked,d+1))} disabled=${day>=save.unlocked} aria-label="次の日">›</button>
          </div>
          <div className="wallet">資金<b>${yen(save.wallet)}</b></div>
        </div>
        <button className="cta" onClick=${()=>goIntro(day)}>開店する</button>
        <div className="grid2">
          <button className="ghost" onClick=${()=>open('shop')}>お店</button>
          ${!HOME_APP&&html`<button className="ghost" onClick=${()=>open('rank')}>ランキング</button>`}
          <button className="ghost" onClick=${()=>open('book')}>図鑑</button>
          <button className="ghost" style=${HOME_APP?{gridColumn:'1 / -1'}:null} onClick=${()=>open('howto')}>あそびかた</button>
        </div>
        <p className="best">${bestDay?`これまでの最高：${bestDay}日目 ${yen(save.best[bestDay])}`:'まずは1日目、開店してみよう'}</p>
      </div>
    </div>`}

    ${screen==='intro'&&html`<div className="sheet"><div className="card">
      <div className="intro-day"><b>${day}</b>日目</div>
      <h2>${dayInfo(day).title}</h2>
      <ul>${dayInfo(day).lines.map((l,i)=>html`<li key=${i}>${l}</li>`)}</ul>
      <div className="rules">
        <span>${['白桃','洋梨',...EXTRA_FRUITS.filter(f=>save.owned[f]).map(f=>FRUIT[f].name)].join('・')}</span>
        ${save.opts.ice&&html`<span>氷入りあり</span>`}${save.opts.mix&&html`<span>ミックスあり</span>`}
      </div>
      <div className="goal">今日の売上目標<b>${yen(goal)}</b></div>
      <button className="cta" onClick=${begin}>はじめる</button>
      <button className="link" onClick=${toTitle}>タイトルにもどる</button>
    </div></div>`}

    ${screen==='result'&&result&&html`<div className="sheet"><div className="receipt">
      <div className="r-head"><span>お会計伝票</span><span>${result.day}日目</span></div>
      <div className="r-shop">果実喫茶 しゅわっと</div>
      <dl>
        <div><dt>提供した杯数</dt><dd>${result.served}杯</dd></div>
        <div><dt>ぴったり</dt><dd>${result.perfect}杯</dd></div>
        <div><dt>最大コンボ</dt><dd>${result.maxCombo}</dd></div>
        <div><dt>うちチップ</dt><dd>${yen(result.tips)}</dd></div>
        ${result.legends>0&&html`<div><dt>LEGENDARY</dt><dd>${result.legends}回</dd></div>`}
      </dl>
      <div className="r-total"><span>本日の売上</span><b>${yen(result.sales)}</b></div>
      <div className="r-goal">目標 ${yen(result.goal)}</div>
      <div className="r-foot">
        <div className="stars" aria-label=${`星${result.stars}つ`}>${[1,2,3].map(i=>html`<span key=${i} className=${i<=result.stars?'on':''}>★</span>`)}</div>
        <div className=${'stamp '+(result.passed?'ok':'ng')}>${result.passed?html`<span>目標<br/>達成</span>`:html`<span>あと<br/>${yen(result.goal-result.sales)}</span>`}</div>
      </div>
      <div className="r-note">お店の資金に ${yen(result.sales)} 入りました（いま ${yen(save.wallet)}）${result.newBest?html`<br/><b>自己ベスト更新！</b>`:''}${rankNote?html`<br/>${rankNote}`:''}</div>
      <div className="r-actions">
        ${result.passed?html`<button className="cta" onClick=${()=>goIntro(result.day+1)}>${result.day+1}日目へ</button>`:html`<button className="cta" onClick=${()=>goIntro(result.day)}>もう一度</button>`}
        <div className="row2">${result.passed&&html`<button className="ghost" onClick=${()=>goIntro(result.day)}>もう一度</button>`}<button className="ghost" onClick=${()=>open('shop')}>お店</button>${!HOME_APP&&html`<button className="ghost" onClick=${()=>open('rank')}>ランキング</button>`}</div>
        <button className="link" onClick=${toTitle}>タイトルへ</button>
      </div>
    </div></div>`}

    ${modal==='pause'&&html`<div className="sheet"><div className="card">
      <h2>ひと休み中</h2>
      <p style=${{fontSize:'14px',margin:'0 0 16px'}}>${day}日目・売上 ${yen(hud.sales)}</p>
      <button className="cta" onClick=${resume}>再開する</button>
      <div className="row2" style=${{marginTop:'10px'}}><button className="ghost" onClick=${()=>setModal('settings')}>設定</button><button className="ghost" onClick=${toTitle}>タイトルへ</button></div>
    </div></div>`}
    ${modal==='settings'&&Settings()}
    ${modal==='shop'&&html`<${Shop} save=${save} onBuy=${buy} onClose=${()=>setModal(null)}/>`}
    ${modal==='rank'&&html`<${Ranking} save=${save} cloud=${cloud} onNick=${setNick} onClose=${()=>setModal(null)}/>`}

    ${modal==='howto'&&html`<div className="sheet" onClick=${e=>{ if(e.target===e.currentTarget) setModal(null); }}><div className="card">
      <h2>あそびかた</h2>
      <ol>
        <li>注文カードとグラスの<b>線の色</b>を見る。線の色が注ぐ果汁の色。</li>
        <li>下の<b>果汁ボタンを長押し</b>すると、ボトルが傾いて注げる。白桃は左、洋梨は右。新メニューを買うとボタンが増える（位置はいつも同じ）。</li>
        <li>指をはなしても少し流れるので、<b>線の少し手前</b>で止めるのがコツ。</li>
        <li>勢いよく注ぐと<b>泡</b>が立つ。あふれる前に少し待つと泡が落ち着く。</li>
        <li><b>氷×2</b>の注文は「氷」ボタンで入れる。氷で水位が上がるので、先に入れると安心。</li>
        <li><b>ミックス</b>は上のメーターの針を目標の枠に入れつつ、線まで注ぐ。</li>
        <li>線まで注げたら<b>「どうぞ！」</b>。売上はお店の資金になり、改装や新メニューに使える。</li>
      </ol>
      <p style=${{fontSize:'12px',color:'var(--ink-soft)',margin:'0 0 14px'}}>パソコンでは ← / A で左はし、→ / D で右はし、1〜5 で左から何番目かのボトル、I で氷、スペースで「どうぞ！」</p>
      <button className="cta" onClick=${()=>setModal(null)}>わかった</button>
    </div></div>`}

    ${modal==='book'&&html`<div className="sheet" onClick=${e=>{ if(e.target===e.currentTarget) setModal(null); }}><div className="card wide">
      <h2>図鑑</h2>
      <h3>常連さん <small>${SPECIES_KEYS.filter(k=>save.species[k]).length} / ${SPECIES_KEYS.length}</small></h3>
      <div className="grid3">${SPECIES_KEYS.map(k=>{ const seen=!!save.species[k]; return html`<div key=${k} className=${'tile'+(seen?'':' lock')}><${Face} k=${k} locked=${!seen}/>${seen?SPECIES[k].short:'？？？'}<span className="d">${seen?SPECIES[k].like:'まだ来ていない'}</span></div>`; })}</div>
      <h3>グラス <small>${GLASS_KEYS.filter(k=>save.glasses[k]).length} / ${GLASS_KEYS.length}</small></h3>
      <div className="grid3">${GLASS_KEYS.map(k=>{ const seen=!!save.glasses[k]; return html`<div key=${k} className=${'tile'+(seen?'':' lock')}><${GlassIcon} k=${k} locked=${!seen}/>${seen?GLASSES[k].name:'？？？'}<span className="d">${seen?GLASSES[k].desc:`${GLASSES[k].day}日目に登場`}</span></div>`; })}</div>
      <h3>メニュー <small>${ALL_FRUITS.filter(f=>BASE_FRUITS.includes(f)||save.owned[f]).length} / ${ALL_FRUITS.length}</small></h3>
      <div className="grid3">${ALL_FRUITS.map(f=>{ const has=BASE_FRUITS.includes(f)||save.owned[f]; return html`<div key=${f} className=${'tile'+(has?'':' lock')}><${FruitIcon} f=${f}/>${has?FRUIT[f].name+'ソーダ':'？？？'}<span className="d">${has?(FRUIT[f].desc?'お店で追加':'最初からあるよ'):'お店で買える'}</span></div>`; })}</div>
      <div className="legendline">LEGENDARY 達成：${save.legend||0}回</div>
      <button className="cta" style=${{marginTop:'14px'}} onClick=${()=>setModal(null)}>とじる</button>
    </div></div>`}
  </div>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script>
</body></html>
